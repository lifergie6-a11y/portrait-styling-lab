[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portrait-styling-lab"
version = "0.1.0"
description = "SFW modular open-source portrait makeup & hairstyle editing benchmark pipeline"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0.0",
    "PyYAML>=6.0",
    "numpy>=1.24.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
eval = [
    "insightface>=0.7.3",
    "onnxruntime>=1.17.0",
    "opencv-python-headless>=4.9.0",
]
mediapipe = [
    "mediapipe>=0.10.14",
    "opencv-python-headless>=4.9.0",
]
diffusers = [
    "torch>=2.4.0",
    "transformers>=4.51.0",
    "accelerate>=1.2.0",
    "safetensors>=0.4.5",
    "sentencepiece>=0.2.0",
    "diffusers>=0.33.0",
]
quant = [
    "bitsandbytes>=0.45.0",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
pstyle = "portrait_styling.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
